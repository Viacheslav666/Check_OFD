server:
  port: ${SERVER_PORT:18443}

spring:
  application:
    name: ofd-marking-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ofd_marking}
    username: ${DB_USER:ofd}
    password: ${DB_PASSWORD:ofd}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Центральное приложение: ключа ОФД здесь нет — данные приходят от агентов на RDP.
central:
  poll-enabled: ${CENTRAL_POLL_ENABLED:true}
  poll-cron: "${CENTRAL_POLL_CRON:0 */5 * * * *}"
  poll-on-startup: ${CENTRAL_POLL_ON_STARTUP:true}
  page-size: 500
  parallelism: 6
  connect-timeout-seconds: 10
  read-timeout-seconds: 60
  collect-wait-seconds: 180
  offline-after-minutes: 15
  # Демо/docker: "имя|хост|порт|токен;..." — добавить агентов при первом старте
  bootstrap-agents: ${CENTRAL_BOOTSTRAP_AGENTS:}

app:
  client-api-key: ${CLIENT_API_KEY:}
  default-worst-threshold-percent: 25.0

logging:
  level:
    root: INFO
    ru.ofd.marking: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
